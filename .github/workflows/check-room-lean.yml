name: Check Room Lean

on:
  push:
    branches:
      - paper/the-room-learning-constitution
    paths:
      - "papers/the-room-learning-constitution/TheRoom.lean"
      - ".github/workflows/check-room-lean.yml"

jobs:
  check-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean version
        run: lean --version

      - name: Check TheRoom.lean
        run: lean papers/the-room-learning-constitution/TheRoom.lean
