name: Build Elephant Parable PDF

on:
  push:
    branches:
      - paper/the-room-learning-constitution
    paths:
      - ".github/workflows/build-elephant-parable-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile parable
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: papers/the-room-learning-constitution
          root_file: the_elephant_and_the_agreement.tex

      - name: Commit rendered PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/the-room-learning-constitution/the_elephant_and_the_agreement.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build elephant parable PDF"
            git push
          fi
