name: v21 Integration Check

on:
  pull_request:
    paths:
      - 'THEORY_CORE_V21.md'
      - 'FORMAL_THEORY_MAP.md'
      - 'FORMAL_THEORY_ENDPOINT.md'
      - 'UNIVERSAL_TO_INTELLIGENCE.md'
      - 'README.md'
      - 'RELEASE_VERSION'
      - 'RELEASE_TITLE'
      - 'RELEASE_NOTES.md'
      - 'CITATION.cff'
      - 'citation.cff'
      - '.zenodo.json'
      - 'formalization/cumulative-accessibility/**'
      - 'research/cumulative-reproduction/**'
      - 'research/anchored-correctability/**'
      - 'scap-seed/**'
      - '.github/workflows/v21-integration-check.yml'
      - '.github/workflows/publish-release.yml'
  push:
    branches: [main]
    paths:
      - 'THEORY_CORE_V21.md'
      - 'FORMAL_THEORY_MAP.md'
      - 'FORMAL_THEORY_ENDPOINT.md'
      - 'UNIVERSAL_TO_INTELLIGENCE.md'
      - 'README.md'
      - 'RELEASE_VERSION'
      - 'RELEASE_TITLE'
      - 'RELEASE_NOTES.md'
      - 'CITATION.cff'
      - 'citation.cff'
      - '.zenodo.json'
      - 'formalization/cumulative-accessibility/**'
      - 'research/cumulative-reproduction/**'
      - 'research/anchored-correctability/**'
      - 'scap-seed/**'
      - '.github/workflows/v21-integration-check.yml'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-metadata:
    name: Release metadata coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate CITATION.cff against CFF 1.2
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: '--validate'
      - name: Check v21.1 and Zenodo metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          test "$VERSION" = "v21.1"
          grep -q '^Evolution by Emergence v21.1' RELEASE_TITLE
          grep -q '^# Evolution by Emergence v21.1' RELEASE_NOTES.md
          test -s THEORY_CORE_V21.md
          test -s FORMAL_THEORY_MAP.md
          test -s FORMAL_THEORY_ENDPOINT.md
          test -s UNIVERSAL_TO_INTELLIGENCE.md
          test -s CITATION.cff
          test -s .zenodo.json
          test ! -e citation.cff
          grep -q 'research/anchored-correctability' THEORY_CORE_V21.md
          grep -q 'research/cumulative-reproduction' THEORY_CORE_V21.md
          grep -q 'scap-seed' THEORY_CORE_V21.md

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = Path('RELEASE_VERSION').read_text(encoding='utf-8').strip()
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          zenodo = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))

          if f'version: "{version}"' not in cff:
              raise SystemExit('CITATION.cff version does not match RELEASE_VERSION')
          if 'license: "CC-BY-4.0 OR Apache-2.0"' in cff:
              raise SystemExit('CITATION.cff contains an invalid SPDX OR expression')
          if not re.search(r'(?m)^license:\s*\n\s+-\s+CC-BY-4\.0\s*\n\s+-\s+Apache-2\.0\s*$', cff):
              raise SystemExit('CITATION.cff must preserve the repository dual-license list')

          if zenodo.get('version') != version:
              raise SystemExit('.zenodo.json version does not match RELEASE_VERSION')
          if zenodo.get('upload_type') != 'software':
              raise SystemExit('.zenodo.json must describe a software release')
          if zenodo.get('access_right') != 'open':
              raise SystemExit('.zenodo.json must keep the release open access')
          license_value = zenodo.get('license')
          if not isinstance(license_value, str) or not license_value:
              raise SystemExit('.zenodo.json must use one string license for Zenodo GitHub ingestion')
          if license_value.lower() != 'cc-by-4.0':
              raise SystemExit('.zenodo.json archival license must be cc-by-4.0')
          if not zenodo.get('creators'):
              raise SystemExit('.zenodo.json must name at least one creator')
          PY

  universal-structure:
    name: Universal structural core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/cumulative-accessibility
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        shell: bash
        run: |
          curl --retry 5 --retry-all-errors --connect-timeout 20 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build and audit v20/v21 structural surface
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake build CumulativeAccessibility.AuditAll CumulativeAccessibility.VerificationSurface
          output="$($HOME/.elan/bin/lake env lean CumulativeAccessibility/VerificationSurface.lean 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo 'Universal structural surface contains sorryAx.' >&2
            exit 1
          fi

  cumulative-reproduction:
    name: Cumulative Reproduction Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit CRM Lean core
        working-directory: research/cumulative-reproduction/lean
        shell: bash
        run: |
          set -euo pipefail
          lean CumulativeReproduction.lean | tee lean-audit.log
          if grep -q 'sorryAx' lean-audit.log; then
            echo 'CRM contains sorryAx.' >&2
            exit 1
          fi
          test "$(grep -c 'depends on axioms:' lean-audit.log)" -eq 16
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install -r research/cumulative-reproduction/requirements.txt
      - name: Run CRM regressions
        run: python -m unittest discover -s research/cumulative-reproduction/sim -p 'test_*.py' -v
      - name: Smoke-run E1-E8
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/cumulative-reproduction/sim/experiments.py --quick --output-dir "$RUNNER_TEMP/crm-quick"

  anchored-correctability:
    name: Anchored Correctability / SCAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit 227-result intelligent-system surface
        working-directory: research/anchored-correctability/lean
        shell: bash
        run: |
          set -euo pipefail
          lake build 2>&1 | tee lean-audit.log
          if grep -q 'sorryAx' lean-audit.log; then
            echo 'Anchored Correctability contains sorryAx.' >&2
            exit 1
          fi
          test "$(grep -c '^#print axioms ' AnchoredEvolution/Audit.lean)" -eq 227

  scap-seed:
    name: SCAP Seed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scap-seed
    steps:
      - uses: actions/checkout@v6
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify seed proofs and audit
        run: scripts/verify.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install seed simulation dependencies
        run: pip install -r sim/requirements.txt
      - name: Smoke-run seed simulations
        run: |
          cd sim
          python experiments.py --quick
          python fragmentation_experiments.py --quick
