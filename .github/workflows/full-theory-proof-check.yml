name: Full Theory Proof Check

on:
  pull_request:
    paths:
      - "THEORY.md"
      - "FORMAL_THEORY_MAP.md"
      - "RELEASE_VERSION"
      - "RELEASE_TITLE"
      - "RELEASE_NOTES.md"
      - "formalization/**"
      - "papers/the-room-learning-constitution/**"
      - "verification/organizational-depth/**"
      - ".github/workflows/full-theory-proof-check.yml"
  push:
    branches:
      - main
    paths:
      - "THEORY.md"
      - "FORMAL_THEORY_MAP.md"
      - "RELEASE_VERSION"
      - "RELEASE_TITLE"
      - "RELEASE_NOTES.md"
      - "formalization/**"
      - "papers/the-room-learning-constitution/**"
      - "verification/organizational-depth/**"
      - ".github/workflows/full-theory-proof-check.yml"
  workflow_dispatch:

jobs:
  affinity:
    name: Affinity layer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/affinity-layer
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build and audit
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake build
          output="$($HOME/.elan/bin/lake env lean AffinityLayer.lean 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Affinity theory surface contains sorryAx." >&2
            exit 1
          fi

  collective-alignment:
    name: Collective alignment and maintenance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/collective-alignment
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build and audit
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake build
          output="$({
            $HOME/.elan/bin/lake env lean CollectiveAlignment.lean
            $HOME/.elan/bin/lake env lean MaintenanceReproduction.lean
            $HOME/.elan/bin/lake env lean MaintenanceDynamics.lean
          } 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Collective-alignment theory surface contains sorryAx." >&2
            exit 1
          fi

  persistence-drift:
    name: Persistence, selection, and slack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/persistence-drift
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build and audit
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake build
          output="$({
            $HOME/.elan/bin/lake env lean PersistenceDrift.lean
            $HOME/.elan/bin/lake env lean FunctionalCompetition.lean
            $HOME/.elan/bin/lake env lean ReturnPathPrice.lean
            $HOME/.elan/bin/lake env lean RegulatoryReturn.lean
            $HOME/.elan/bin/lake env lean EquilibriumExposure.lean
            $HOME/.elan/bin/lake env lean FunctionalThresholds.lean
          } 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Persistence-drift theory surface contains sorryAx." >&2
            exit 1
          fi

  cumulative-accessibility:
    name: Cumulative accessibility and dynamic vortex
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/cumulative-accessibility
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build integrated theory surface
        run: |
          $HOME/.elan/bin/lake build
          $HOME/.elan/bin/lake build \
            CumulativeAccessibility.AuditAll \
            CumulativeAccessibility.VerificationSurface \
            CumulativeAccessibility.DynamicVortexWitness \
            CumulativeAccessibility.QuantitativeAccessibility \
            CumulativeAccessibility.RetainedOrganizationCore \
            CumulativeAccessibility.TransitionAccessibility \
            CumulativeAccessibility.EmergentAssemblyBarrier \
            CumulativeAccessibility.TransitionMediatedEmergence \
            CumulativeAccessibility.GenerativeLeverage \
            CumulativeAccessibility.PaidRetentionTransfer \
            CumulativeAccessibility.PaidReuseHierarchy \
            CumulativeAccessibility.RepetitionDepth \
            CumulativeAccessibility.EmergentPaidTransfer \
            CumulativeAccessibility.V17Compatibility \
            CumulativeAccessibility.LearningConstitutionSpecialization \
            CumulativeAccessibility.IntelligentLearningMaintenance \
            CumulativeAccessibility.FunctionalRatchetVelocity \
            CumulativeAccessibility.RatchetVelocityLedger \
            CumulativeAccessibility.BoundedUpdateRate \
            CumulativeAccessibility.SearchValidationTradeoff \
            CumulativeAccessibility.StateDependentAllocation \
            CumulativeAccessibility.BottleneckAllocation \
            CumulativeAccessibility.AdaptiveRatePolicy \
            CumulativeAccessibility.ConstrainedRatePolicy \
            CumulativeAccessibility.ClosedLoopRateControl \
            CumulativeAccessibility.FunctionalRatePolicy \
            CumulativeAccessibility.PolicyImprovement \
            CumulativeAccessibility.PolicyLearning \
            CumulativeAccessibility.RateRegret
      - name: Audit integrated theory axioms
        shell: bash
        run: |
          set -euo pipefail
          output="$({
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/VerificationSurface.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/DynamicVortex.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/DynamicVortexWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/QuantitativeAccessibility.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/RetainedOrganizationCore.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/TransitionAccessibility.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/EmergentAssemblyBarrier.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/TransitionMediatedEmergence.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/GenerativeLeverage.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/PaidRetentionTransfer.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/PaidReuseHierarchy.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/RepetitionDepth.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/EmergentPaidTransfer.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/V17Compatibility.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/LearningConstitutionSpecialization.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/IntelligentLearningMaintenance.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/FunctionalRatchetVelocity.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/RatchetVelocityLedger.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/BoundedUpdateRate.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/SearchValidationTradeoff.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/StateDependentAllocation.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/BottleneckAllocation.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/AdaptiveRatePolicy.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/ConstrainedRatePolicy.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/ClosedLoopRateControl.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/FunctionalRatePolicy.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/PolicyImprovement.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/PolicyLearning.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/RateRegret.lean
          } 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Cumulative-accessibility theory surface contains sorryAx." >&2
            exit 1
          fi

  organizational-depth:
    name: Physical depth and operational bridge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification/organizational-depth
    steps:
      - uses: actions/checkout@v6
      - name: Install elan
        shell: bash
        run: |
          curl --retry 5 --retry-all-errors --connect-timeout 20 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0
      - name: Resolve dependencies
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Build and audit
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake build
          output="$({
            $HOME/.elan/bin/lake env lean OrganizationalDepth.lean
            $HOME/.elan/bin/lake env lean OperationalBridge.lean
            $HOME/.elan/bin/lake env lean PackingDepth.lean
            $HOME/.elan/bin/lake env lean MaintenanceDynamicsEndToEnd.lean
          } 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Organizational-depth theory surface contains sorryAx." >&2
            exit 1
          fi
