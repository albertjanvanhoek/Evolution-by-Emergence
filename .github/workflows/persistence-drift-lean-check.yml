name: Persistence Drift Lean Check

on:
  push:
    branches:
      - main
      - chatgpt/persistence-drift-lean-check
      - chatgpt/persistence-function-paper
      - chatgpt/regulation-retention-paper
    paths:
      - "formalization/persistence-drift/**"
      - ".github/workflows/persistence-drift-lean-check.yml"
  pull_request:
    paths:
      - "formalization/persistence-drift/**"
      - ".github/workflows/persistence-drift-lean-check.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/persistence-drift
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: |
          $HOME/.elan/bin/lake update
      - name: Fetch Mathlib cache
        run: |
          $HOME/.elan/bin/lake exe cache get
      - name: Compile
        run: |
          $HOME/.elan/bin/lake build
