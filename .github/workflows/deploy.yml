# GitHub Pages build & deploy — LaTeX ➜ Markdown with Lua front matter
# ===================================================================
# • Trigger: push to main
# • Reads version from RELEASE_VERSION when present, otherwise last Git tag
# • Converts publication/book LaTeX sources to docs/<source-path>.md
# • Generates web-safe figure assets in the build workspace
# • Builds MkDocs in strict mode and deploys to GitHub Pages
# • Does not write generated assets back to main

name: Build & Deploy Site

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install documentation and scientific Python dependencies
        run: |
          pip install mkdocs-material numpy scipy matplotlib
          pip install --upgrade "pymdown-extensions>=10.5"

      # Tectonic is not packaged by Ubuntu 24.04 (the ubuntu-latest image).
      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          tectonic-version: 0.15.0

      - name: Render standalone TikZ files to PDF & SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc pdf2svg
          pandoc --version
          tectonic --version
          for tex in $(find docs/figures -name '*.tex'); do
            base="${tex%.tex}"
            tectonic -Z shell-escape "$tex"
            pdf2svg "${base}.pdf" "${base}.svg"
          done

      - name: Generate organizational accessibility figures
        run: python scripts/generate_organizational_accessibility_figures.py

      - name: Generate organizational-depth web figure
        run: |
          python verification/organizational-depth/tightness/make_figure.py
          test -s verification/organizational-depth/tightness/figures/tightness.pdf
          pdf2svg \
            verification/organizational-depth/tightness/figures/tightness.pdf \
            docs/figures/tightness.svg
          test -s docs/figures/tightness.svg

      # Generated figures are deployment artifacts. Do not commit them from CI:
      # renderer metadata and generated SVG IDs can be nondeterministic, and a
      # workflow-side commit makes the tested/released SHA ambiguous and creates
      # unnecessary history/race conditions. The site below uses the freshly
      # generated files directly from this workspace.

      - name: Compute release/book version
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s RELEASE_VERSION ]]; then
            BOOK_VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          else
            BOOK_VERSION="$(git describe --tags --abbrev=0 || echo 0.0-dev)"
          fi
          echo "BOOK_VERSION=$BOOK_VERSION" >> "$GITHUB_ENV"
          echo "Version for build: $BOOK_VERSION"

      - name: Convert LaTeX to Markdown with YAML front matter
        shell: bash
        run: |
          set -euxo pipefail
          while IFS= read -r -d '' tex; do
            rel="${tex#./}"
            out="docs/${rel%.tex}.md"
            mkdir -p "$(dirname "$out")"
            pandoc "$tex" \
              --from=latex --to=markdown+fenced_divs \
              --standalone --mathjax --wrap=none \
              --lua-filter=filters/pdf2svg.lua \
              --lua-filter=filters/add_yaml.lua \
              -o "$out"
          done < <(
            find . \
              -type f -name '*.tex' \
              ! -name 'main.tex' \
              ! -name 'Instructions_to_complile_the_book.tex' \
              ! -path './docs/figures/*' \
              ! -path './verification/*' \
              ! -path './.github/*' \
              ! -path './.git/*' \
              -print0
          )

      - name: Build site
        run: mkdocs build --strict

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
