name: Build Learning Constitution PDF

on:
  push:
    branches:
      - paper/the-room-learning-constitution
    paths:
      - ".github/workflows/build-learning-constitution-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Learning Constitution
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: papers/the-room-learning-constitution
          root_file: the_learning_constitution.tex
      - name: Commit PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/the-room-learning-constitution/the_learning_constitution.pdf
          if git diff --cached --quiet; then
            echo "No PDF change."
          else
            git commit -m "Build Learning Constitution PDF"
            git push
          fi
