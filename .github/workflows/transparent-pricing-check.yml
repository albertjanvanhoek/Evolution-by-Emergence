name: Transparent Pricing Check

on:
  push:
    branches:
      - main
    paths:
      - "formalization/transparent-pricing/**"
      - ".github/workflows/transparent-pricing-check.yml"
  pull_request:
    paths:
      - "formalization/transparent-pricing/**"
      - ".github/workflows/transparent-pricing-check.yml"

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/transparent-pricing
    steps:
      - uses: actions/checkout@v6

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build (core Lean only, no Mathlib)
        run: |
          $HOME/.elan/bin/lake build

      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake env lean Audit.lean 2>&1 | tee audit.log
          if grep -q 'sorryAx' audit.log; then
            echo 'Unproved axiom detected' >&2
            exit 1
          fi
          count=$(grep -c "depends on axioms\|does not depend on any axioms" audit.log)
          echo "Audited results: $count"
          test "$count" -ge 76
