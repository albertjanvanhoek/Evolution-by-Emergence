name: Lean fixed-resolution verification

on:
  push:
    branches:
      - lean-fixed-resolution-verification
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan and Lean
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/elan" default leanprover/lean4:v4.33.0
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Resolve Mathlib
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get

      - name: Build proof
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
