name: Publish GitHub Release

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Build & Deploy Site"]
    types: [completed]

jobs:
  publish-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate release and archive metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          test -s RELEASE_VERSION
          test -s RELEASE_TITLE
          test -s RELEASE_NOTES.md
          test -s CITATION.cff
          test -s .zenodo.json
          test ! -e citation.cff

          VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          TITLE="$(cat RELEASE_TITLE)"
          SHA="${{ github.event.workflow_run.head_sha }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+([.][0-9]+){0,2}$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          version = Path('RELEASE_VERSION').read_text(encoding='utf-8').strip()
          title = Path('RELEASE_TITLE').read_text(encoding='utf-8').strip()
          notes = Path('RELEASE_NOTES.md').read_text(encoding='utf-8')
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          zenodo = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))

          if version not in title or not notes.startswith(f'# Evolution by Emergence {version}'):
              raise SystemExit('Release version, title and notes are inconsistent')
          if f'version: "{version}"' not in cff:
              raise SystemExit('CITATION.cff version does not match RELEASE_VERSION')
          if 'license: "CC-BY-4.0 OR Apache-2.0"' in cff:
              raise SystemExit('CITATION.cff contains an invalid SPDX OR expression')
          if not re.search(r'(?m)^license:\s*\n\s+-\s+CC-BY-4\.0\s*\n\s+-\s+Apache-2\.0\s*$', cff):
              raise SystemExit('CITATION.cff must preserve the dual-license list')

          if zenodo.get('version') != version:
              raise SystemExit('.zenodo.json version does not match RELEASE_VERSION')
          if zenodo.get('upload_type') != 'software' or zenodo.get('access_right') != 'open':
              raise SystemExit('.zenodo.json release type/access metadata is inconsistent')
          license_value = zenodo.get('license')
          if not isinstance(license_value, str) or license_value.lower() != 'cc-by-4.0':
              raise SystemExit('.zenodo.json must use one cc-by-4.0 license value for GitHub ingestion')
          if not zenodo.get('creators'):
              raise SystemExit('.zenodo.json must name at least one creator')
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail

          # Normal post-release development must not try to move an existing
          # historical tag. If the declared version is already published,
          # this workflow is intentionally a successful no-op until the
          # release metadata is bumped for the next release.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          git fetch --tags --force

          # A tag without a corresponding published release is treated as a
          # release-integrity condition: it must identify the exact tested SHA.
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$VERSION")"
            if [[ "$TAG_SHA" != "$RELEASE_SHA" ]]; then
              echo "Tag $VERSION already exists at $TAG_SHA, expected $RELEASE_SHA" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" "$RELEASE_SHA" -m "$RELEASE_TITLE"
            git push origin "refs/tags/$VERSION"
          fi

          gh release create "$VERSION" \
            --verify-tag \
            --title "$RELEASE_TITLE" \
            --notes-file RELEASE_NOTES.md
