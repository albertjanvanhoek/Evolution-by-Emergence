name: Cumulative Accessibility Check

on:
  push:
    branches:
      - main
    paths:
      - "formalization/cumulative-accessibility/**"
      - "formalization/collective-alignment/**"
      - "papers/when-does-change-become-cumulative/**"
      - ".github/workflows/cumulative-accessibility-lean-check.yml"
  pull_request:
    paths:
      - "formalization/cumulative-accessibility/**"
      - "formalization/collective-alignment/**"
      - "papers/when-does-change-become-cumulative/**"
      - ".github/workflows/cumulative-accessibility-lean-check.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/cumulative-accessibility
    steps:
      - uses: actions/checkout@v6

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Update dependencies
        run: |
          $HOME/.elan/bin/lake update

      - name: Fetch Mathlib cache
        run: |
          $HOME/.elan/bin/lake exe cache get

      - name: Compile library and formal-core targets
        run: |
          $HOME/.elan/bin/lake build
          $HOME/.elan/bin/lake build \
            CumulativeAccessibility.AuditAll \
            CumulativeAccessibility.VerificationSurface \
            CumulativeAccessibility.FormalCoreWitness \
            CumulativeAccessibility.MaintenanceGatedWitness \
            CumulativeAccessibility.BoundedResponseWitness \
            CumulativeAccessibility.EndogenousBudgetWitness \
            CumulativeAccessibility.DynamicVortexWitness \
            CumulativeAccessibility.QuantitativeAccessibility \
            CumulativeAccessibility.IntelligentLearningMaintenance \
            CumulativeAccessibility.FunctionalRatchetVelocity \
            CumulativeAccessibility.RatchetVelocityLedger

      - name: Reject unproven formal-core axioms
        shell: bash
        run: |
          set -euo pipefail
          output="$({
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/VerificationSurface.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/FormalCoreWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/MaintenanceGatedWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/BoundedResponseWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/EndogenousBudgetWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/DynamicVortex.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/DynamicVortexWitness.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/QuantitativeAccessibility.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/IntelligentLearningMaintenance.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/FunctionalRatchetVelocity.lean
            $HOME/.elan/bin/lake env lean CumulativeAccessibility/RatchetVelocityLedger.lean
          } 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'sorryAx' <<<"$output"; then
            echo "Formal-core axiom audit contains sorryAx." >&2
            exit 1
          fi

  budget-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify exact and numerical budget-ratchet checks
        run: |
          python papers/when-does-change-become-cumulative/verify_budget_ratchet.py
          python papers/when-does-change-become-cumulative/verify_log_slack.py
