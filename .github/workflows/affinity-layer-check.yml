name: Affinity Layer Check

on:
  push:
    branches:
      - main
      - chatgpt/affinity-layer
    paths:
      - "formalization/affinity-layer/**"
      - "papers/affinity-before-accessibility/**"
      - ".github/workflows/affinity-layer-check.yml"
  pull_request:
    paths:
      - "formalization/affinity-layer/**"
      - "papers/affinity-before-accessibility/**"
      - ".github/workflows/affinity-layer-check.yml"

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formalization/affinity-layer
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: |
          $HOME/.elan/bin/lake update
      - name: Fetch Mathlib cache
        run: |
          $HOME/.elan/bin/lake exe cache get
      - name: Compile
        run: |
          $HOME/.elan/bin/lake build

  affinity-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify affinity formulas
        run: |
          python papers/affinity-before-accessibility/verify_affinity.py
