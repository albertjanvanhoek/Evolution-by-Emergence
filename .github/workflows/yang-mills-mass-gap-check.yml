name: Yang-Mills Mass Gap Check

on:
  push:
    branches:
      - main
    paths:
      - "research/yang-mills-mass-gap/lean/**"
      - ".github/workflows/yang-mills-mass-gap-check.yml"
  pull_request:
    paths:
      - "research/yang-mills-mass-gap/lean/**"
      - ".github/workflows/yang-mills-mass-gap-check.yml"

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/yang-mills-mass-gap/lean
    steps:
      - uses: actions/checkout@v6

      # Downloads from GitHub (elan, the Lean toolchain, Mathlib and its cache)
      # failed transiently in several runs on 8 November 2026 (HTTP 503).
      # Each network step is therefore retried with a growing pause.
      - name: Install elan
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none; then break; fi
            if [ "$i" = 5 ]; then echo "elan install failed 5 times" >&2; exit 1; fi
            sleep $((i * 30))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Lean toolchain
        shell: bash
        run: |
          tc="$(cat lean-toolchain)"
          for i in 1 2 3 4 5; do
            if $HOME/.elan/bin/elan toolchain install "$tc"; then break; fi
            if [ "$i" = 5 ]; then echo "toolchain download failed 5 times" >&2; exit 1; fi
            sleep $((i * 30))
          done
          $HOME/.elan/bin/lean --version

      - name: Update dependencies
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if $HOME/.elan/bin/lake update; then break; fi
            if [ "$i" = 5 ]; then echo "lake update failed 5 times" >&2; exit 1; fi
            sleep $((i * 30))
          done

      - name: Fetch Mathlib cache
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if $HOME/.elan/bin/lake exe cache get; then break; fi
            if [ "$i" = 5 ]; then echo "Mathlib cache download failed 5 times" >&2; exit 1; fi
            sleep $((i * 30))
          done

      - name: Build
        run: |
          $HOME/.elan/bin/lake build

      - name: Audit axioms
        shell: bash
        run: |
          set -euo pipefail
          $HOME/.elan/bin/lake env lean Audit.lean 2>&1 | tee audit.log
          if grep -q 'sorryAx' audit.log; then
            echo 'Unproved axiom detected' >&2
            exit 1
          fi
          count=$(grep -c "depends on axioms\|does not depend on any axioms" audit.log)
          echo "Audited results: $count"
          test "$count" -ge 14
